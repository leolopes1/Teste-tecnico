<section class="filter-panel">

  <div class="filter-header">
    <div class="filter-heading">
      <span class="filter-title">Filtros</span>
      <span class="filter-subtitle">Pesquisar Lotes Outros Créditos/Débitos</span>
    </div>
  </div>

  <form [formGroup]="form">

    <div class="filter-grid">

      <mat-form-field appearance="outline">
        <mat-label>Instituição Resp.</mat-label>
        <input matInput formControlName="instituicaoResponsavel" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Instituição</mat-label>
        <input matInput formControlName="instituicao" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Situação Lote</mat-label>

        <mat-select formControlName="situacao">
          <mat-option value="TODAS">
            Todas
          </mat-option>

          <mat-option value="ABERTO">
            Aberto
          </mat-option>

          <mat-option value="ENVIADO">
            Enviado
          </mat-option>

          <mat-option value="CONFIRMADO">
            Confirmado
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="range-field">
        <label>ID Lote</label>

        <div>
          <mat-form-field appearance="outline">
            <mat-label>De</mat-label>
            <input matInput type="number" formControlName="idLoteDe" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Até</mat-label>
            <input matInput type="number" formControlName="idLoteAte" />
          </mat-form-field>
        </div>
      </div>

      <div class="range-field">
        <label>Valor Lote</label>

        <div>
          <mat-form-field appearance="outline">
            <mat-label>De</mat-label>
            <input matInput mask="separator.2" thousandSeparator="." decimalMarker="," prefix="R$ " inputmode="decimal"
              formControlName="valorLoteDe" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Até</mat-label>
            <input matInput mask="separator.2" thousandSeparator="." decimalMarker="," prefix="R$ " inputmode="decimal"
              formControlName="valorLoteAte" />
          </mat-form-field>
        </div>
      </div>

      <div class="range-field">
        <label>Data Entrada</label>

        <div>
          <mat-form-field appearance="outline">
            <mat-label>De</mat-label>

            <input matInput [matDatepicker]="dataDe" formControlName="dataEntradaDe" />

            <mat-datepicker-toggle matIconSuffix [for]="dataDe" />
            <mat-datepicker #dataDe />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Até</mat-label>

            <input matInput [matDatepicker]="dataAte" formControlName="dataEntradaAte" />

            <mat-datepicker-toggle matIconSuffix [for]="dataAte" />
            <mat-datepicker #dataAte />
          </mat-form-field>
        </div>
      </div>

    </div>

    <div class="filter-actions">
      <button mat-flat-button type="button" color="primary" (click)="onPesquisar()">
        Pesquisar
      </button>
    </div>

  </form>

</section>
